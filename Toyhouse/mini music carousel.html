<!-- F2U Mini Music Carousel code by NynaSunner

    PLACEHOLDER REPLACEMENT GUIDE
    Click Ctrl + F to search the following and replace them with what you want
    - Images: https://picsum.photos/80
    - Music: VIDEOLINK
    
    To set the music you want go to youtube and copypaste the part after 'watch?v=' from the URL

<div class="carousel slide" id="music" data-pause="true">
	<div class="carousel-inner">

		<div class="carousel-item active">
			<img src="https://picsum.photos/80" class="float-left mr-3 rounded" style="height:70px;width:70px">

			<p class="m-0 text-muted text-truncate">Artist 1</p>
			<!-- CONTROLS -->
			<div class="d-flex" style="font-size:1em">
				<a href="#music" data-slide="prev" style="color:inherit"><i class="fa fa-backward"></i></a>
				<span class="mx-2" style="overflow:hidden;position:relative">
					<iframe style="height:13em;width:10em;opacity:.001;top:-4em;left:-4em;position:absolute;z-index:10" src="https://www.youtube.com/embed/VIDEOLINK"></iframe>
					<i class="fas fa-play"></i>
				</span>
